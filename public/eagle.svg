<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="Eagle">
  <defs>
    <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#c98f2c"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d178"/>
      <stop offset="1" stop-color="#a8701f"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efc25c"/>
      <stop offset="1" stop-color="#8f5c16"/>
    </linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dba63f"/>
      <stop offset="1" stop-color="#6f430f"/>
    </linearGradient>
    <linearGradient id="f5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98f2c"/>
      <stop offset="1" stop-color="#5a350c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="640" fill="none"/>
  <ellipse cx="500" cy="300" rx="470" ry="300" fill="url(#glow)"/>

  <g stroke="#2a1a06" stroke-width="2" stroke-opacity="0.55" stroke-linejoin="round">
    <!-- head -->
    <polygon points="500,24 462,52 430,96 500,150" fill="url(#f1)"/>
    <polygon points="500,24 538,52 570,96 500,150" fill="url(#f1)"/>
    <!-- neck / upper chest -->
    <polygon points="430,96 352,150 432,268 500,250 500,150" fill="url(#f2)"/>
    <polygon points="570,96 648,150 568,268 500,250 500,150" fill="url(#f2)"/>
    <!-- inner wing -->
    <polygon points="352,150 258,112 322,224 432,268" fill="url(#f3)"/>
    <polygon points="648,150 742,112 678,224 568,268" fill="url(#f3)"/>
    <!-- outer wing -->
    <polygon points="258,112 108,128 56,216 196,238 322,224" fill="url(#f4)"/>
    <polygon points="742,112 892,128 944,216 804,238 678,224" fill="url(#f4)"/>
    <!-- body / tail -->
    <polygon points="432,268 476,452 500,628 500,430 500,250" fill="url(#f5)"/>
    <polygon points="568,268 524,452 500,628 500,430 500,250" fill="url(#f5)"/>
  </g>

  <!-- beak -->
  <polygon points="486,120 500,150 514,120" fill="#e0a63a" stroke="#2a1a06" stroke-width="2" stroke-opacity="0.5" stroke-linejoin="round"/>
  <!-- eyes -->
  <circle cx="478" cy="70" r="7" fill="#1b1206"/>
  <circle cx="522" cy="70" r="7" fill="#1b1206"/>
  <circle cx="480" cy="68" r="2.4" fill="#fff3cf"/>
  <circle cx="524" cy="68" r="2.4" fill="#fff3cf"/>
</svg>
